<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUDOKU MASTER</title>
  <link rel="stylesheet" href="style.css">
  <!-- レトロフォントの読み込み -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<!-- 初期状態をダークテーマにする場合 data-theme="dark" を付与 -->
<body data-theme="dark">
  
  <div id="app">
    <!-- ヘッダーエリア -->
    <header class="game-header">
      <h1 class="game-title">SUDOKU</h1>
      <div class="status-bar">
        <span id="tp-display">TP:0000</span>
        <!-- テーマ切替テスト用ボタン -->
        <button id="btn-theme-toggle" class="btn" style="padding: 4px; font-size:0.6rem;">THEME</button>
      </div>
    </header>

    <!-- メインコンテンツ（JSで画面切替を行う領域） -->
    <main id="main-content">
      
      <!-- 1. メインメニュー画面 -->
      <section id="screen-menu" class="screen active">
        <!-- レトロな点滅メッセージ -->
        <p class="retro-blink" style="text-align: center; margin-bottom: 20px; font-size: 0.8rem;">
          - PRESS ANY BUTTON -
        </p>

        <div class="menu-buttons" style="display:flex; flex-direction:column; gap:16px;">
          <button id="btn-tower" class="btn-retro">[ TOWER MODE ]</button>
          <button id="btn-normal" class="btn-retro">[ NORMAL MODE ]</button>
          <button id="btn-custom" class="btn-retro">[ SAVE / LOAD ]</button>
          <button id="btn-dictionary" class="btn-retro">[ DICTIONARY ]</button>
          <button id="btn-shop" class="btn-retro">[ SHOP ]</button>
        </div>
      </section>

      <!-- 2. パズルプレイ画面 -->
      <section id="screen-game" class="screen">
        <div class="game-info" style="display:flex; justify-content:space-between; margin-bottom:10px;">
          <button id="btn-back-menu" class="btn" style="padding:6px;">< BACK</button>
          <span id="mode-title" style="align-self:center;">TOWER - FL.01</span>
        </div>

        <div id="board-container" class="board-container">
          <!-- JSで9x9マスを生成 -->
        </div>

        <div class="controls">
          <div class="action-buttons" style="display:grid; grid-template-columns:repeat(4, 1fr); gap:4px; margin-bottom:8px;">
            <button id="btn-memo" class="btn">MEMO</button>
            <button id="btn-if-mode" class="btn">IF</button>
            <button id="btn-erase" class="btn">DEL</button>
            <button id="btn-undo" class="btn">UNDO</button>
          </div>
          <div class="numpad" style="display:grid; grid-template-columns:repeat(5, 1fr); gap:4px;">
            <button class="btn num-btn" data-value="1">1</button>
            <button class="btn num-btn" data-value="2">2</button>
            <button class="btn num-btn" data-value="3">3</button>
            <button class="btn num-btn" data-value="4">4</button>
            <button class="btn num-btn" data-value="5">5</button>
            <button class="btn num-btn" data-value="6">6</button>
            <button class="btn num-btn" data-value="7">7</button>
            <button class="btn num-btn" data-value="8">8</button>
            <button class="btn num-btn" data-value="9">9</button>
          </div>
        </div>
      </section>

    </main>
  </div> <!-- /#app -->

  <!-- すりガラス風 ポーズ・ダイアログモーダル（画面全体のオーバーレイとして最背面に配置） -->
  <div id="pause-modal" class="modal-overlay">
    <div class="modal-content">
      <h2 style="margin-bottom: 16px;">PAUSED</h2>
      <button id="btn-resume" class="btn-retro">RESUME</button>
    </div>
  </div>

  <!-- CRT（ブラウン管）走査線オーバーレイ -->
  <div id="crt-overlay"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
