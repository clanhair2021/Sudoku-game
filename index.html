<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新感覚ナンプレゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- ヘッダー（タイトル・TP表示・テーマ切替など） -->
    <header class="game-header">
      <h1 class="game-title">ナンプレ Master</h1>
      <div class="status-bar">
        <span id="tp-display">TP: 0</span>
      </div>
    </header>

    <!-- メインコンテンツ領域（JSで画面切替） -->
    <main id="main-content">
      
      <!-- 1. メインメニュー画面 -->
      <section id="screen-menu" class="screen active">
        <h2 class="menu-title">メインメニュー</h2>
        <div class="menu-buttons">
          <button id="btn-tower" class="btn btn-primary">🏰 タワーモード</button>
          <button id="btn-normal" class="btn">🎮 通常モード</button>
          <button id="btn-custom" class="btn">💾 保存モード</button>
          <button id="btn-dictionary" class="btn">📖 技図鑑</button>
          <button id="btn-shop" class="btn">🛒 ショップ</button>
        </div>
      </section>

      <!-- 2. パズルプレイ画面（共通盤面UI） -->
      <section id="screen-game" class="screen">
        <!-- 階層 / 難易度・モード情報表示 -->
        <div class="game-info">
          <button id="btn-back-menu" class="btn-small">← メニューへ</button>
          <span id="mode-title">タワーモード - 1階</span>
        </div>

        <!-- 9x9 ナンプレ盤面コンテナ -->
        <div id="board-container" class="board-container">
          <!-- board.js にて動的に 81 マスが生成されます -->
        </div>

        <!-- 操作パネル（数字入力・メモ・仮置き（IF）・消去・戻る） -->
        <div class="controls">
          <div class="action-buttons">
            <button id="btn-memo" class="btn-action">メモ [OFF]</button>
            <button id="btn-if-mode" class="btn-action">仮置き(IF)</button>
            <button id="btn-erase" class="btn-action">消去</button>
            <button id="btn-undo" class="btn-action">1手戻す</button>
          </div>
          <!-- 1〜9の数字選択ボタン -->
          <div class="numpad">
            <button class="num-btn" data-value="1">1</button>
            <button class="num-btn" data-value="2">2</button>
            <button class="num-btn" data-value="3">3</button>
            <button class="num-btn" data-value="4">4</button>
            <button class="num-btn" data-value="5">5</button>
            <button class="num-btn" data-value="6">6</button>
            <button class="num-btn" data-value="7">7</button>
            <button class="num-btn" data-value="8">8</button>
            <button class="num-btn" data-value="9">9</button>
          </div>
        </div>
      </section>

      <!-- 3. 技図鑑画面 -->
      <section id="screen-dictionary" class="screen">
        <h2>📖 技図鑑</h2>
        <div id="dictionary-list" class="dictionary-list">
          <!-- JSで解放された技の一覧を動的生成 -->
        </div>
        <button class="btn-back btn">戻る</button>
      </section>

    </main>
  </div>

  <!-- スクリプトの読み込み（ES Modules仕様） -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
